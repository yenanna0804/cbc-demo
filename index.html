<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMS Cell Broadcast VNPT – Demo</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --line:#dfe3ea; --line2:#eef1f5; --text:#1b2330; --muted:#5d6878; --faint:#8a94a3;
  --pri:#1f5fae; --pri-d:#174a88; --pri-l:#e8f0fb;
  --ok:#1e7b46; --ok-l:#e6f4ec; --warn:#a15c00; --warn-l:#fff4e0; --err:#b4321f; --err-l:#fdecea; --info-l:#eef3f9;
  --r:8px; --sh:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg)}
a{color:var(--pri);text-decoration:none} a:hover{text-decoration:underline}
h1{font-size:20px;margin:0} h2{font-size:16px;margin:0} h3{font-size:14px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f7f9fc}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff} .btn.pri:hover{background:var(--pri-d)}
.btn.danger{color:var(--err);border-color:#efc2bb} .btn.danger:hover{background:var(--err-l)}
.btn.dangerfill{background:var(--err);border-color:var(--err);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--pri);padding:4px 6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd3f2;border-color:var(--pri)}
input[readonly],textarea[readonly]{background:#f7f8fa}
label.f{display:block;font-weight:600;margin:0 0 4px;font-size:13px}
.req{color:var(--err)}
.hint{color:var(--muted);font-size:12.5px;margin-top:3px}
.ferr{color:var(--err);font-size:12.5px;margin-top:3px}
.has-err input,.has-err select,.has-err textarea{border-color:var(--err)}
.grid{display:grid;gap:14px} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .mono{font-family:Consolas,"SFMono-Regular",monospace}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card>.hd{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card>.bd{padding:16px}
.mb{margin-bottom:14px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-draft{background:#eef0f3;color:#4a5565}.b-pending{background:var(--warn-l);color:var(--warn)}.b-rejected{background:var(--err-l);color:var(--err)}
.b-cancelled{background:#f1f1f1;color:#777}.b-broadcasting{background:var(--ok-l);color:var(--ok)}.b-stopped{background:#ece9f7;color:#5b45a6}.b-expired{background:#e9eef4;color:#41546b}
.b-role{background:var(--pri-l);color:var(--pri)}
.alert{padding:10px 14px;border-radius:6px;margin-bottom:14px;border:1px solid}
.alert.err{background:var(--err-l);border-color:#f2c6bf;color:#7d2215}
.alert.warn{background:var(--warn-l);border-color:#f0d9a8;color:#6d4300}
.alert.info{background:var(--info-l);border-color:#d6e2f1;color:#24405f}
.alert.ok{background:var(--ok-l);border-color:#bfe2cd;color:#14532f}
.alert ul{margin:4px 0 0 18px;padding:0}
table.t{width:100%;border-collapse:collapse}
.t th,.t td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
.t th{font-size:12.5px;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:#f7faff}
.t td.num,.t th.num{text-align:right}
.t td.mono{white-space:nowrap}
.hamb{display:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px}
.kv>div:nth-child(odd){color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--pri-l);color:var(--pri);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;margin:2px 4px 2px 0}
.chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
.prog{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.dk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dt{border:1px solid var(--line2);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.dt .v{font-size:20px;font-weight:700;line-height:1.3} .dt .v small{font-size:13px;font-weight:600;color:var(--muted)}
.dt .tag{margin-top:auto;padding-top:6px}
.tag span{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:600}
.t-ok{background:var(--ok-l);color:var(--ok)} .t-cond{background:var(--warn-l);color:var(--warn)} .t-no{background:#eef0f3;color:#4a5565}
h3.sec{margin:2px 0 10px;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
.compose>div{min-width:0}
.sec-h{margin:24px 0 12px} .sec-h h2{font-size:18px} .sec-h .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px} .tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--sh)}
.tile .l{font-weight:600;font-size:13px;color:#3a4556;display:flex;gap:8px;align-items:center;flex-wrap:wrap} .tile .v{font-size:28px;font-weight:700;margin:10px 0 2px;line-height:1.2}
.tile .v.na{color:#8a94a3;font-size:22px} .tile .s{font-size:12.5px;color:var(--muted)}
.c-ok{color:#1f8a6b} .c-pri{color:#2457d6} .c-warn{color:#b26a00} .c-err{color:var(--err)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap} .p-net{background:#fff1d6;color:#9a5b00} .p-no{background:#eef0f3;color:#4a5565} .p-ext{background:#e8ebfb;color:#3d4ab0} .p-cms{background:#e3f4ea;color:#1e7b46}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px} .two .card,.tiles .tile{min-width:0}
.kv2{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;margin-top:10px} .kv2>div{padding:10px 0;border-bottom:1px solid var(--line2);min-width:0}
.kv2 .k{font-size:12px;color:var(--muted)} .kv2 .v{font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.big{font-size:34px;font-weight:700;color:#1f8a6b;line-height:1}
.bar2{height:10px;border-radius:99px;background:#e9edf3;overflow:hidden;display:flex} .bar2 i{display:block;height:100%}
.legend{display:flex;gap:14px;margin:8px 0 14px;color:var(--muted)} .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.trow{display:grid;grid-template-columns:60px 1fr 170px;gap:10px;align-items:center;font-size:12.5px;margin:8px 0} .trow>:last-child{text-align:right}
.note{background:#f6f8fb;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#33415a}
.formula{border-left:3px solid #4f7be8;background:#f6f8fb;padding:10px 14px;font-size:12.5px;margin-top:14px}
.sb{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px} .sb-ok{background:var(--ok-l);color:var(--ok)} .sb-fail{background:var(--err-l);color:var(--err)} .sb-pend{background:var(--warn-l);color:var(--warn)}
.t tr.sel td{background:#eef4fd}
.howto{background:var(--info-l);border:1px solid #d6e2f1;border-radius:6px;padding:10px 12px;color:#24405f}
.cmds{display:flex;flex-direction:column;gap:10px}
.cmd{border:1px solid var(--line2);border-left:3px solid var(--pri);border-radius:6px;padding:10px 12px}
.cmd.kill{border-left-color:#5b45a6}
.cmd .no{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--pri-l);color:var(--pri);font-size:12px;font-weight:700;align-items:center;justify-content:center}
.hb{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:12.5px;margin:3px 0}
.hb .bar{height:12px;background:#e9edf3;border-radius:3px;overflow:hidden} .hb .bar i{display:block;height:100%;background:var(--pri)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs a{padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--pri);border-color:var(--pri);font-weight:600} .tabs a:hover{text-decoration:none;color:var(--text)}

/* layout */
#app{display:flex;min-height:100vh}
.side{width:236px;background:#14243a;color:#c9d3e0;flex:none;display:flex;flex-direction:column}
.brand{padding:16px 18px;border-bottom:1px solid #22344d}
.brand b{display:block;color:#fff;font-size:15px}
.brand span{font-size:12px;color:#8fa1b8}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7f93ad;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:8px;color:#c9d3e0;padding:8px 10px;border-radius:6px}
.nav a:hover{background:#1c3150;text-decoration:none}
.nav a.on{background:var(--pri);color:#fff}
.nav .cnt{margin-left:auto;background:#d9822b;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.side .foot{padding:10px 18px;font-size:11.5px;color:#7f93ad;border-top:1px solid #22344d}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:5}
.who{display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;padding:6px 8px;border-radius:6px}
.who:hover{background:#f4f6f9}
.av{width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.menu{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(20,30,50,.14);min-width:250px;padding:6px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:#f4f6f9}
.menu hr{border:0;border-top:1px solid var(--line2);margin:6px 0}
.content{padding:20px 24px 40px;max-width:1400px;width:100%}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph .sub{color:var(--muted);font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters>div{min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700}
.kpi .l{color:var(--muted);font-size:13px}

/* compose */
.compose{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.sticky{position:sticky;top:72px}
.secno{width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ctabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff}
.ctabs label{padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);user-select:none}
.ctabs input{display:none}
.ctabs label:has(input:checked){border-bottom-color:var(--pri);color:var(--pri);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{padding:7px 14px;cursor:pointer;border-right:1px solid var(--line);user-select:none}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg input:checked+span{color:var(--pri);font-weight:600}
.seg label:has(input:checked){background:var(--pri-l)}
.xalist{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.xalist label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.xalist label .faint{margin-left:auto}
.phone{background:#1d232c;border-radius:26px;padding:14px 12px 18px;margin:0 auto;max-width:300px}
.screen{background:#eef1f5;border-radius:16px;min-height:300px;padding:16px 12px;display:flex;align-items:center}
.alertbox{background:#fff;border-radius:12px;padding:14px;width:100%;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.alertbox .ttl{font-weight:700;color:#b4321f;font-size:13px;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.alertbox .msg{font-size:13px;white-space:pre-wrap;word-break:break-word}
.alertbox .okb{margin-top:12px;text-align:center;color:var(--pri);font-weight:600;border-top:1px solid #eee;padding-top:8px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:#f6f8fb;border-radius:6px;padding:8px;text-align:center}
.stats b{display:block;font-size:16px}
.stats span{font-size:11.5px;color:var(--muted)}
.var{background:#fff3c4;border-radius:3px;padding:0 2px}
.pvar{color:var(--err);font-weight:700}.plink{color:#551a8b;text-decoration:underline;word-break:break-all}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diff pre{white-space:pre-wrap;word-break:break-word;background:#f7f8fa;border:1px solid var(--line2);border-radius:6px;padding:10px;margin:4px 0 0;font:inherit;font-size:13px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 12px 18px;border-left:2px solid var(--line2);margin-left:6px}
.timeline li:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.timeline li:last-child{border-color:transparent}

/* modal, toast, sms */
.ov{position:fixed;inset:0;background:rgba(15,25,40,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:10px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:92vh;display:flex;flex-direction:column}
.modal.wide{max-width:760px}
.modal .hd{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center}
.modal .bd{padding:18px;overflow:auto}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}
.x{border:0;background:none;font-size:20px;cursor:pointer;margin-left:auto;color:var(--muted)}
.otp{letter-spacing:.5em;font-size:22px;text-align:center;font-family:Consolas,monospace}
#toasts{position:fixed;right:18px;top:68px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#1b2330;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:380px;font-size:13.5px}
.toast.ok{background:var(--ok)} .toast.err{background:var(--err)} .toast.warn{background:#a15c00}
#sms{position:fixed;left:18px;bottom:18px;z-index:70;width:330px;display:none}
#sms .card{border-color:#c9d8ec}
#sms .hd{background:#eef4fb}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login .l{background:linear-gradient(160deg,#14243a,#1f5fae);color:#dfe8f4;padding:48px;display:flex;flex-direction:column;justify-content:center}
.login .l h1{color:#fff;font-size:28px;margin-bottom:10px}
.login .r{display:grid;place-items:center;padding:24px}
.login .box{width:100%;max-width:380px}
.demo-acc{margin-top:18px}
.demo-acc button{display:flex;width:100%;text-align:left;gap:8px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.demo-acc button:hover{background:#f7f9fc}
/* ===== giao diện chuẩn: Arial 12px, nhãn đậm, viền xám 1px bo nhẹ, nút #5879B9 ===== */
:root{--bg:#fff;--panel:#fff;--line:#d5d9df;--line2:#e8eaee;--text:#333;--muted:#666;--faint:#8c8c8c;
  --pri:#5879B9;--pri-d:#4767a4;--pri-l:#eef2f9;--head:#f5f6f8;--focus:#9db7e3;--r:3px;--sh:none}
body,button,input,select,textarea{font-family:Arial,Helvetica,sans-serif}
body{font-size:12px;line-height:1.5;color:var(--text);background:#fff}
h1{font-size:16px} h2{font-size:14px} h3{font-size:12px} .sec-h h2{font-size:15px}
.small,.hint,.ferr,.ph .sub,.sec-h .sub,.tile .s,.note,.formula,.howto,.trow,.hb,.chip,.kv2 .k{font-size:11.5px}
label.f,.kv>div:nth-child(odd),.kv2 .k,.tile .l,.t th,.legend{font-weight:700;color:var(--text)}
.kv2 .v{font-weight:400}
.kpi .l{font-weight:700;color:var(--text);font-size:12px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{
  border:1px solid var(--line);border-radius:2px;padding:5px 8px;font-size:12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--focus);box-shadow:0 0 0 2px #e6eefa}
.btn{border-radius:2px;padding:5px 12px;font-size:12px;border-color:var(--line)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.pri{background:var(--pri);border-color:var(--pri)} .btn.pri:hover{background:var(--pri-d)}
.card,.tile,.modal,.menu,.dt,.cmd,.note,.howto,.xalist,.seg,.diff pre,.alert,.toast,.demo-acc button,.stats div,.formula{border-radius:var(--r)}
.card,.tile{box-shadow:none;border-color:var(--line)}
.card>.hd,.modal .hd,.t th,#sms .hd{background:var(--head)}
.top{background:var(--head)}
.badge,.sb,.pill,.chip,.nav .cnt{border-radius:2px}
.tile{padding:12px 14px} .tile .v{font-size:22px;margin:6px 0 2px} .tile .v.na{font-size:18px}
.kpi .v{font-size:22px} .big{font-size:28px} .dt .v{font-size:18px}
.c-pri{color:var(--pri)} .formula{border-left-color:var(--pri)}
.t th,.t td{padding:7px 9px} .t th{font-size:11.5px}
.card>.hd{padding:10px 14px} .card>.bd{padding:14px}
/* thanh điều hướng nền sáng */
.side{background:var(--head);color:var(--text);border-right:1px solid var(--line)}
.brand{border-bottom:1px solid var(--line)} .brand b{color:var(--text);font-size:14px} .brand span{color:var(--muted);font-size:11px}
.nav .grp{color:var(--muted);font-weight:700}
.nav a{color:var(--text);border-radius:2px} .nav a:hover{background:#e9ecf1}
.nav a.on{background:var(--pri);color:#fff}
.side .foot{color:var(--muted);border-top:1px solid var(--line)}
.login .l{background:var(--pri)}
.otp{font-size:18px}
.toast,.diff pre{font-size:12px} .dt .v small{font-size:12px}

const parseD = v => { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((v||'').trim()); if (!m) return null; const d = new Date(+m[3], +m[2]-1, +m[1]); return d.getDate()===+m[1] && d.getMonth()===+m[2]-1 ? d : null; };
const dayFrom = v => { const d = parseD(v); return d ? d.setHours(0,0,0,0) : null; }, dayTo = v => { const d = parseD(v); return d ? d.setHours(23,59,59,999) : null; };

const left = ms => { if(ms<=0) return '0 phút'; const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return h? `${h} giờ ${m} phút` : (m? `${m} phút ${ss} giây` : `${ss} giây`); };
const noAccent = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ toast('Không lưu được dữ liệu vào trình duyệt (localStorage bị chặn).','err'); } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* Đếm ký tự & số trang CB: 1 trang = 82 octet → 93 ký tự GSM 7-bit hoặc 41 ký tự UCS-2 */
const MAX_CHARS = 650; /* URD 3.1 chức năng 5: tối đa 2 trang CB (650 ký tự) */
function measure(text){
  text = text || '';
  let gsm = true, septets = 0;
  for (const ch of text){
    if (GSM.includes(ch)) septets += 1;
    else if (GSM_EXT.includes(ch)) septets += 2;
    else { gsm = false; break; }
  }
  if (gsm) return {cs:'Không dấu (GSM 7-bit)', len:septets, per:93, pages: Math.max(1, Math.ceil(septets/93))};
  const len = text.length;
  return {cs:'Có dấu (UCS-2)', len, per:41, pages: Math.max(1, Math.ceil(len/41))};
}

/* Serial Number 16 bit = GS (2 bit, 01 = chống trùng toàn mạng) | Message Code (10 bit) | Update Number (4 bit).
   Message Code cấp duy nhất cho từng bản tin để 2 bản tin khác nhau không bị máy coi là trùng. */
function allocMsgCode(m){
  if (m.msgCode != null) return;
  const used = new Set(S.messages.filter(x => x !== m && x.msgCode != null && x.status==='broadcasting' && x.priority==m.priority).map(x => x.msgCode));
  let c = S.msgSeq || 0; for (let i = 0; i < 1024 && used.has(c % 1024); i++) c++;
  m.msgCode = c % 1024; S.msgSeq = (c + 1) % 1024;
}
function serial(m){ allocMsgCode(m); const code = m.msgCode; return '0x' + (((1 << 14) | (code << 4) | (m.updateNo % 16)) >>> 0).toString(16).toUpperCase().padStart(4,'0'); }

  smsShow(user.phone, `Ma OTP CBC VNPT: ${code}. Dung de ${noAccent(purpose)}. Hieu luc ${Math.round(S.settings.otpTtl/60)} phut. Khong cung cap ma cho nguoi khac.`);

function otpCheck(input){
  if (!otpCtx) return {ok:false, msg:'Phiên OTP không tồn tại.'};
  if (now() > otpCtx.exp) return {ok:false, msg:'Mã OTP đã hết hiệu lực. Bấm "Gửi lại mã".', expired:true};
  if (input.trim() === otpCtx.code){ const c = otpCtx; otpCtx = null; smsHide(); return {ok:true, ctx:c}; }
  otpCtx.fails++;
  const remain = S.settings.otpMaxFail - otpCtx.fails;
  if (remain <= 0){ const c = otpCtx; otpCtx = null; smsHide(); return {ok:false, locked:true, ctx:c, msg:`Nhập sai OTP ${S.settings.otpMaxFail} lần. Phiên xác thực bị huỷ.`}; }
  return {ok:false, msg:`Mã OTP không đúng. Còn ${remain} lần thử.`};
}

/* ---------- quyền ---------- */
function can(act, m){
  if (!me) return false;
  const own = m && m.createdBy === me.id;
  switch(act){
    case 'create': return me.role==='SO';
    case 'edit': case 'cancel': return me.role==='SO' && own && ['draft','rejected'].includes(m.status);
    case 'submit': return me.role==='SO' && own && ['draft','rejected'].includes(m.status);
    case 'approve': return me.role==='PD' && m.status==='pending' && m.createdBy !== me.id;
    case 'update': case 'stop': return me.role==='SO' && m.status==='broadcasting' && !m.pendingAction;
    case 'approveAction': return me.role==='PD' && m.pendingAction && m.pendingAction.by !== me.id && m.status==='broadcasting';
    case 'cancelAction': return m.pendingAction && m.pendingAction.by === me.id;
    case 'retry': return me.role==='SO' && m.status==='broadcasting' && !roundPending(m) && retryable(m).length > 0;
    case 'rebroadcast': return me.role==='SO' && m.status==='stopped' && !roundPending(m);
    case 'retryKill': return me.role==='SO' && ['stopped','expired'].includes(m.status) && !roundPending(m) && killRetryable(m).length > 0;
    case 'admin': return me.role==='QT';
  }
  return false;
}

/* ---------- mô phỏng mạng: phát / cập nhật / phát lại / dừng / hết hạn ----------
   Mỗi lần CBC gửi lệnh xuống mạng là một "lượt gửi" (m.rounds). Trạng thái hiện tại của từng cell ở m.results,
   thông tin tích luỹ theo cell ở m.cinfo: số lần gửi lệnh, lần gửi gần nhất, lúc phát thành công, số lần phát lại. */
const RTYPE = {initial:'Lệnh phát', update:'Lệnh cập nhật nội dung', retry:'Thử lại cell lỗi', rebroadcast:'Phát lại bản tin (sau khi dừng)', kill:'Lệnh huỷ phát (dừng thủ công)', expire:'Lệnh huỷ phát (hết thời hạn)', killretry:'Gửi lại lệnh huỷ cho cell lỗi'};
const isKill = t => t==='kill' || t==='expire' || t==='killretry';
function sendRound(m, type, cells, by, note){
  const at = now() + 300 + Math.floor(Math.random()*600);
  const r = {no:(m.rounds||[]).length+1, type, at, by, serial:m.serial, updateNo:m.updateNo, cells:[...cells], res:{}, doneAt:null, note:note||''};
  m.rounds = m.rounds || []; m.cinfo = m.cinfo || {};
  cells.forEach(c => {
    const ci = m.cinfo[c] = m.cinfo[c] || {sends:0, lastAt:null, okAt:null, retries:0, count:null};
    if (isKill(type)){ r.res[c] = 'pending'; m.kres = m.kres || {}; m.kres[c] = 'pending'; ci.kills = (ci.kills||0) + 1; return; }
    r.res[c] = 'pending'; m.results[c] = 'pending'; ci.sends++; ci.lastAt = at;
    if (type==='retry') ci.retries++;
    if (type==='update') ci.okAt = null;
    if (type==='rebroadcast'){ ci.okAt = null; ci.count = null; ci.retries = 0; if (m.kres) delete m.kres[c]; }
  });
  m.rounds.push(r); m.doneAt = isKill(type) ? m.doneAt : null;
  return r;
}
/* Số lần trạm đã phát trên sóng: trạm tự lặp lại mỗi chu kỳ; khi đang phát là ước tính, khi dừng là số mạng trả về (mô phỏng) */
function airCount(m, c){
  const ci = (m.cinfo||{})[c]; if (!ci || !ci.okAt) return null;
  if (ci.count != null) return ci.count;
  const end = m.endedAt || Math.min(now(), m.endAt);
  return Math.max(1, Math.floor((end - ci.okAt) / (m.repetition*1000)) + 1);
}
function finalizeCounts(m){ m.cells.forEach(c => { const ci = (m.cinfo||{})[c]; if (ci && ci.okAt && ci.count == null) ci.count = Math.max(1, Math.floor((m.endedAt - ci.okAt)/(m.repetition*1000)) + 1); }); }
const roundPending = m => (m.rounds||[]).some(r => Object.values(r.res).includes('pending'));
function killRetryable(m){ const max = S.settings.retryMax; return m.cells.filter(c => (m.kres||{})[c]==='fail' && (((m.cinfo||{})[c]||{}).kills||0) <= max); }
function retryable(m){ const max = S.settings.retryMax; return m.cells.filter(c => m.results[c]==='fail' && ((m.cinfo||{})[c]||{}).retries < max); }

function broadcast(m, approver){
  m.status = 'broadcasting'; m.approvedBy = approver.id; m.approverUnit = approver.unit; m.approvedAt = now();
  m.cells = cellsOf(m.areas); m.results = {}; m.cinfo = {}; m.rounds = []; m.serial = serial(m);
  const r = sendRound(m, 'initial', m.cells, 'SYS');
  m.sentAt = r.at; m.startAt = r.at; m.endAt = m.startAt + m.duration*60e3;   // duyệt → gửi lệnh < 2 giây (mục 3.1)
  m.history.push({at:m.approvedAt, by:approver.id, act:'Duyệt (OTP hợp lệ)'});
  m.history.push({at:m.sentAt, by:'SYS', act:'Gửi lệnh phát (Write-Replace Warning Request) tới MME', note:`${m.cells.length} cell · Serial ${m.serial} · sau ${((m.sentAt-m.approvedAt)/1000).toFixed(1)} giây kể từ khi duyệt`});
  log('Phát tin','Gửi lệnh phát tới MME', `${m.code} – ${m.cells.length} cell`, 'Quan trọng', 'SYS');
}
function applyUpdate(m, a, approver){
  m.versions.push({at:now(), updateNo:m.updateNo, body:m.body, header:m.header});
  m.updateNo++; m.body = a.body; m.serial = serial(m); m.updatedAt = now();
  const r = sendRound(m, 'update', m.cells, approver ? approver.id : a.by, a.reason);
  m.history.push({at:now(), by:approver ? approver.id : a.by, act: approver ? 'Duyệt cập nhật (OTP hợp lệ)' : 'Cập nhật bản tin'});
  m.history.push({at:r.at, by:'SYS', act:'Gửi bản tin cập nhật tới MME', note:`Serial ${m.serial} (lần cập nhật ${m.updateNo}) · lý do: ${a.reason}`});
  log('Phát tin','Gửi bản tin cập nhật', `${m.code} – Serial ${m.serial}`, 'Quan trọng', 'SYS');
}
/* Phát lại sau khi dừng: tăng số cập nhật (Serial mới) để máy đã nhận vẫn hiển thị lại; thời hạn tính lại từ lúc gửi lệnh */
function rebroadcast(m, by, reason){
  m.versions.push({at:now(), updateNo:m.updateNo, body:m.body, header:m.header});
  m.updateNo++; m.serial = serial(m); m.status = 'broadcasting'; m.endedAt = null; m.stopReason = null; m.pendingAction = null;
  const r = sendRound(m, 'rebroadcast', m.cells, by, reason);
  m.startAt = r.at; m.endAt = r.at + m.duration*60e3; m.updatedAt = now();
  m.history.push({at:now(), by, act:'Phát lại bản tin (OTP hợp lệ)', note:reason});
  m.history.push({at:r.at, by:'SYS', act:'Gửi lệnh phát lại (Write-Replace Warning Request) tới MME', note:`${m.cells.length} cell · Serial ${m.serial}`});
  log('Phát tin','Phát lại bản tin sau khi dừng', `${m.code} – Serial ${m.serial}`, 'Quan trọng');
}
function endBroadcast(m, type, by, note){
  m.cells.forEach(c => { if (m.results[c]==='pending') m.results[c]='fail'; });
  (m.rounds||[]).forEach(r => Object.keys(r.res).forEach(c => { if (r.res[c]==='pending') r.res[c]='fail'; }));
  sendRound(m, type, m.cells.filter(c => m.results[c]==='ok'), by, note); finalizeCounts(m);
}
function applyStop(m, a, approver){
  m.status = 'stopped'; m.endedAt = now(); m.stopReason = a.reason;
  endBroadcast(m, 'kill', approver ? approver.id : a.by, a.reason);
  m.history.push({at:now(), by:approver ? approver.id : a.by, act: approver ? 'Duyệt dừng phát (OTP hợp lệ)' : 'Dừng phát'});
  m.history.push({at:now(), by:'SYS', act:'Gửi lệnh dừng (Kill Request) tới MME', note:`Lý do: ${a.reason}`});
  log('Phát tin','Gửi lệnh dừng phát', m.code, 'Quan trọng', 'SYS');
}
function tick(){
  if (!S) return;
  let changed = false; const t = now();
  for (const m of S.messages){
    if (!['broadcasting','stopped','expired'].includes(m.status) || !m.rounds) continue;
    if (m.status==='broadcasting' && t >= m.endAt){
      m.status = 'expired'; m.endedAt = m.endAt; m.pendingAction = null; endBroadcast(m, 'expire', 'SYS', '');
      m.history.push({at:m.endAt, by:'SYS', act:'Hết thời hạn phát – tự gửi lệnh dừng (Kill Request)'});
      log('Phát tin','Tự dừng khi hết thời hạn', m.code, 'Thông tin', 'SYS'); changed = true; continue;
    }
    for (const r of m.rounds || []){
      if (t < r.at) continue;
      const pend = r.cells.filter(c => r.res[c]==='pending'); if (!pend.length) continue;
      const n = Math.max(1, Math.ceil(r.cells.length/6));
      const k = isKill(r.type), pOk = r.type==='retry' || r.type==='killretry' ? 0.9 : 1 - S.settings.simFail/(k ? 200 : 100);
      pend.slice(0,n).forEach(c => { const v = Math.random() < pOk ? 'ok' : 'fail'; r.res[c] = v; if (k) m.kres[c] = v; else { m.results[c] = v; m.cinfo[c].respAt = t; if (v==='ok') m.cinfo[c].okAt = t; } });
      if (pend.length <= n){
        r.doneAt = t; if (!m.doneAt) m.doneAt = t;
        const ok = r.cells.filter(c => r.res[c]==='ok').length, s = resStats(m);
        if (k){
          m.history.push({at:t, by:'SYS', act:`Nhận đủ kết quả lượt gửi #${r.no} (${RTYPE[r.type].toLowerCase()})`, note:`${ok}/${r.cells.length} cell dừng phát thành công`});
          if (ok < r.cells.length) log('Phát tin','Lệnh huỷ phát lỗi ở một số cell', `${m.code} – ${r.cells.length-ok} cell`, 'Cảnh báo', 'SYS');
          changed = true; continue;
        }
        m.history.push({at:t, by:'SYS', act:`Nhận đủ kết quả lượt gửi #${r.no} (${RTYPE[r.type].toLowerCase()})`, note:`${ok}/${r.cells.length} cell thành công · tổng ${s.ok}/${s.total} (${s.rate.toFixed(2)}%)`});
        if (s.rate < S.settings.successThreshold) log('Phát tin','Tỷ lệ phát thành công dưới ngưỡng', `${m.code} – ${s.rate.toFixed(2)}%`, 'Cảnh báo', 'SYS');
      }
      changed = true;
    }
  }
  if (changed){ save(); liveRefresh(); }
}

function migrate(){
  if (!S.seed31){ S.seed31 = 1; S.settings.approveUpdateStop = false; }
  if (!S.seedCmas){ S.seedCmas = 1; S.priorities = CMAS.map(x => ({...x, active:true})); S.templates.forEach(t => { delete t.sound; if (!S.priorities.some(p => p.mi===t.mi)) t.mi = 4370; }); }
  if (!S.seed33){ S.seed33 = 1;
    TEMPLATES_50.forEach(x => { if (!S.templates.some(t => t.id === x[0])) S.templates.push({id:x[0], code:x[0], name:x[2].replace(/[\[\]]/g,''), group:x[1], header:x[2], body:x[3], mi:x[4]||4370, active:true, createdAt:now()}); });
    S.templates.sort((a,b) => a.code.localeCompare(b.code));
    S.templates.forEach(t => { t.active = true; });
    S.priorities.forEach(p => p.active = true);
    if (!S.cells.some(c => c.tech==='5G')){ const r = rng(5); S.xas.filter(x => ['P01','P05'].includes(x.provinceId) && S.cells.some(c => c.xaId===x.id)).forEach(x => { gnbSeq = Math.max(gnbSeq, ...S.cells.map(c => c.enb)); add5G(S.cells, x.id, r); }); }
  }
  const st = S.settings; if (st.retryMax == null) st.retryMax = 3; if (st.simFail == null) st.simFail = 2;
  if (!S.seedLink){
    S.seedLink = 1; const x = n => (S.xas.find(z => z.name === n) || {}).id, ar = [x('Phường Hải Châu'), x('Phường Thanh Khê')].filter(Boolean);
    if (ar.length && S.templates.some(t => t.id === 'TMP-05')){
      const t0 = now() - 3*864e5, d = newMsg({campaign:'Áp thấp nhiệt đới – mưa lớn Đà Nẵng', docNo:'131/BCĐ-PCTT', mode:'template', templateId:'TMP-05',
        vars:{So_Luong_Tinh:'5', Time:'20h00', Link:'https://pctt.gov.vn/b6'}, areas:ar, priority:4370, repetition:20, duration:60}, 'U1', t0);
      d.status='expired'; d.submittedAt=t0+60e3; d.approvedBy='U3'; d.approverUnit='VNPT-VinaPhone'; d.approvedAt=t0+150e3;
      d.sentAt=d.approvedAt+700; d.startAt=d.sentAt; d.endAt=d.startAt+60*60e3; d.endedAt=d.endAt; d.cells=cellsOf(d.areas);
      const rr = rng(11); d.results={}; d.cells.forEach(c => d.results[c] = rr() < 0.995 ? 'ok':'fail'); d.doneAt=d.sentAt+1600; d.serial=serial(d);
      d.history.push({at:d.submittedAt,by:'U1',act:'Gửi duyệt'},{at:d.approvedAt,by:'U3',act:'Duyệt (OTP hợp lệ)'},{at:d.sentAt,by:'SYS',act:'Gửi lệnh phát tới MME',note:`${d.cells.length} cell`},{at:d.endAt,by:'SYS',act:'Hết thời hạn phát – tự gửi lệnh dừng'});
      S.messages.push(d);
    }
  }
  S.messages.forEach(m => {
    (m.rounds||[]).forEach(r => { if (isKill(r.type) && !Object.keys(r.res).length){ r.cells = m.cells.filter(c => m.results[c]==='ok'); m.kres = m.kres || {};
      r.cells.forEach(c => { r.res[c] = 'ok'; m.kres[c] = 'ok'; }); r.doneAt = r.at + 1400; } });
    if (m.sentAt && m.msgCode == null){ m.serial = serial(m); (m.rounds||[]).forEach(r => r.serial = m.serial); }
    if (!m.sentAt || m.rounds) return;
    m.rounds = [{no:1, type:'initial', at:m.sentAt, by:'SYS', serial:m.serial, cells:[...m.cells], res:{...m.results}, doneAt:m.doneAt, note:''}];
    m.cinfo = {}; m.cells.forEach(c => m.cinfo[c] = {sends:1, lastAt:m.sentAt, okAt: m.results[c]==='ok' ? m.sentAt+1000 : null, retries:0, count:null});
    if (m.endedAt){ const kc = m.cells.filter(c => m.results[c]==='ok'); m.kres = {}; const res = {}; kc.forEach(c => { res[c] = 'ok'; m.kres[c] = 'ok'; });
      m.rounds.push({no:2, type: m.status==='stopped'?'kill':'expire', at:m.endedAt, by:'SYS', serial:m.serial, cells:kc, res, doneAt:m.endedAt+1400, note:m.stopReason||''}); finalizeCounts(m); }
  });
}

function recentActs(){

function validate(forSubmit){
  const e = {};
  if (!F.campaign.trim()) e.campaign = 'Nhập tên chiến dịch.';
  if (forSubmit){
    if (!F.docNo.trim()) e.docNo = 'Nhập số văn bản yêu cầu.';
    if (F.mode==='template'){
      const t = S.templates.find(x => x.id===F.templateId);
      if (!t) e.templateId = 'Chọn mẫu tin.';
      else if (!F.body.trim()) e.body = 'Nhập nội dung.';
      else vars(F.body).forEach(v => { if (!(F.vars[v]||'').trim()) e['var_'+v] = 'Nhập giá trị biến.'; });
      if (!F.header.trim()) e.header = 'Nhập tiêu đề.';
      vars(F.body).map(k => [k, F.vars[k]||'']).forEach(([k,v]) => { if (/link/i.test(k) && v.trim() && !/^https:\/\/\S+\.\S+/.test(v.trim())) e['var_'+k] = 'Link phải dạng https://…'; });
    } else {
      if (!F.header.trim()) e.header = 'Nhập tiêu đề.';
      if (!F.body.trim()) e.body = 'Nhập nội dung.';
      else if ((F.body.match(/\bhttps?:\/\/\S*/g)||[]).some(u => !/^https:\/\/\S+\.\S+/.test(u))) e.body = 'Link trong nội dung phải dạng https://…';
      else if (vars(F.body).length) e.body = 'Nội dung còn biến {…} chưa thay giá trị.';
    }
    if (measure(composeText()).len > MAX_CHARS) e.body = `Nội dung vượt ${MAX_CHARS} ký tự (tối đa 2 trang CB).`;
    if (!F.areas.length) e.areas = 'Chọn ít nhất một xã/phường.';
    else if (!areaStats(F.areas).cells) e.areas = 'Vùng đã chọn không có cell nào.';

  return e;
}

          <td class="num small">${n==null?'–':(ci.count!=null?nf(n):'~'+nf(n))}</td>

/* =========================================================================
   DASHBOARD CHIẾN DỊCH (Màn hình 4 + mục báo cáo 1–2 của tài liệu yêu cầu)
   Hạ tầng: số liệu từ phản hồi của MME. Thuê bao/tương tác: chỉ có khi có nguồn ngoài CBC
   (VNPT Net, dịch vụ rút gọn link) – trong demo là số giả lập, ghi rõ trên giao diện.
   ========================================================================= */
const linkOf = m => { const x = fullText(m).match(/https?:\/\/[^\s]+/i); return x ? x[0].replace(/[.,;:)]+$/,'') : null; };
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function simEngage(m){
  const r = rng(parseInt(m.code.replace(/\D/g,''), 10) || 1), reach = subsOf(m);
  const end = Math.min(now(), m.endedAt || m.endAt), el = Math.max(0, (end - m.startAt)/60000);
  const ctr = 0.15 + r()*0.1, tau = 6 + r()*6;
  const cum = t => Math.round(reach * ctr * (1 - Math.exp(-t/tau)));
  const step = m.duration <= 60 ? 5 : 15, buckets = [];
  for (let a = 0; a < el; a += step){
    const b = Math.min(a + step, el);
    if (buckets.length === 7){ buckets.push({from:m.startAt + a*60e3, to:end, n: cum(el) - cum(a), rest:true}); break; }
    buckets.push({from:m.startAt + a*60e3, to:m.startAt + b*60e3, n: cum(b) - cum(a)});
  }
  return {reach, clicks:cum(el), buckets, calls:Math.round(reach*0.0004*(1 - Math.exp(-el/20))), base:Math.round(reach*0.000004*el)};
}

function readRows(file, cb){
  const rd = new FileReader();
  if (/\.xlsx?$/i.test(file.name)){
    if (!window.XLSX) return cb(null, 'Không đọc được file Excel (cần kết nối mạng để tải thư viện). Hãy dùng file CSV.');
    rd.onload = () => { try{ const wb = XLSX.read(new Uint8Array(rd.result), {type:'array'}); cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''})); }catch(e){ cb(null, 'File Excel không hợp lệ.'); } };
    rd.readAsArrayBuffer(file);
  } else { rd.onload = () => cb(String(rd.result).replace(/^﻿/,'').split(/\r?\n/).filter(l => l.trim()).map(l => l.split(','))); rd.readAsText(file); }
}
function importAreas(rows){
  if (!rows || rows.length < 2) return {err:['File không có dữ liệu.']};
  const hdr = rows[0].map(x => String(x).trim().toLowerCase()); const need = ['ma_tinh','ten_tinh','ma_xa','ten_xa'];
  const miss = need.filter(n => !hdr.includes(n)); if (miss.length) return {err:[`Thiếu cột: ${miss.join(', ')}`]};
  const ix = Object.fromEntries(need.map(n => [n, hdr.indexOf(n)])); const err = [], provs = {}, xas = {};
  rows.slice(1).forEach((r,i) => { const g = k => String(r[ix[k]]||'').trim(), row = i+2;
    if (!r.some(v => String(v).trim())) return;
    const pc = g('ma_tinh').toUpperCase(), pn = g('ten_tinh'), xc = g('ma_xa').toUpperCase(), xn = g('ten_xa');
    if (!pc || !pn) return err.push(`Dòng ${row}: thiếu mã hoặc tên tỉnh.`);
    if (provs[pc] && provs[pc] !== pn) return err.push(`Dòng ${row}: mã tỉnh ${pc} có 2 tên khác nhau trong file.`);
    provs[pc] = pn; if (!xc && !xn) return;
    if (!xc || !xn) return err.push(`Dòng ${row}: thiếu mã hoặc tên xã.`);
    if (xas[xc]) return err.push(`Dòng ${row}: trùng mã xã ${xc} trong file.`);
    const old = S.xas.find(x => x.code===xc); if (old && PROV(old.provinceId).code !== pc) return err.push(`Dòng ${row}: mã xã ${xc} đã thuộc ${PROV(old.provinceId).name}; mỗi xã chỉ thuộc 1 tỉnh.`);
    xas[xc] = {pc, name:xn}; });
  Object.keys(xas).forEach(c => { if (provs[c] || S.provinces.some(p => p.code===c)) err.push(`Mã ${c} vừa là mã tỉnh vừa là mã xã.`); });
  return {provs, xas, err};
}
function importCells(text){
  const lines = text.replace(/^﻿/,'').split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return {err:['File không có dữ liệu.']};
  const hdr = lines[0].split(',').map(s => s.trim().toLowerCase());
  const need = ['cell_id','enodeb_gnodeb','ma_xa','cong_nghe'];
  const miss = need.filter(n => !hdr.includes(n)); if (miss.length) return {err:[`Thiếu cột: ${miss.join(', ')}`]};
  const idx = Object.fromEntries(need.map(n => [n, hdr.indexOf(n)]));
  const out = [], err = [], seen = new Set();
  lines.slice(1).forEach((l,i) => {
    const c = l.split(',').map(s => s.trim()); const row = i+2, id = c[idx.cell_id], tech = (c[idx.cong_nghe]||'').toUpperCase();
    const xa = S.xas.find(x => x.code === c[idx.ma_xa]);
    if (!/^\d{3}-\d{2}-\d{1,7}-\d{1,3}$/.test(id||'')) return err.push(`Dòng ${row}: Cell ID "${id||''}" không hợp lệ (dạng MCC-MNC-eNodeB/gNodeB-Cell, VD 452-02-10101-1).`);
    if (seen.has(id)) return err.push(`Dòng ${row}: trùng Cell ID ${id}.`);
    if (!xa) return err.push(`Dòng ${row}: mã xã "${c[idx.ma_xa]}" không có trong danh mục Tỉnh/Xã.`);
    if (!['4G','5G'].includes(tech)) return err.push(`Dòng ${row}: công nghệ phải là 4G hoặc 5G.`);
    seen.add(id);
    const old = S.cells.find(x => x.id===id);
    out.push({id, enb:Number(c[idx.enodeb_gnodeb])||0, xaId:xa.id, tech, subs: old ? old.subs : 0});
  });
  return {rows:out, err};
}

  roleSave(el){ const u = S.users.find(x => x.id===el.dataset.id); const r = (document.querySelector('#modal input[name=role]:checked')||{}).value;
    if (!r){ $('#roleErr').innerHTML = '<div class="alert err">Chọn vai trò.</div>'; return; }
    const old = u.role; u.role = r; log('Người dùng','Phân quyền', `${u.username} · ${old?ROLE[old]+' → ':''}${ROLE[r]}`); save(); closeModal(); toast('Đã lưu vai trò.', 'ok'); render(); },
  userReset(el){ const u = S.users.find(x => x.id===el.dataset.id); if (!confirm(`Đặt lại mật khẩu của ${u.username} về Demo@123?`)) return; u.password = 'Demo@123'; u.failLogin = 0; log('Người dùng','Đặt lại mật khẩu', u.username, 'Quan trọng'); save(); toast('Đã đặt lại mật khẩu.', 'ok'); },
};

document.addEventListener('click', ev => {
  if (ev.target.matches('[data-ov]')) { A.closeModal(); return; }
  const m = $('#umenu'); if (m && m.classList.contains('open') && !ev.target.closest('.who')) m.classList.remove('open');
  if (ev.target.closest('[data-stop]')) { ev.stopPropagation(); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f){ if (el.tagName==='BUTTON' && el.type==='submit') ev.preventDefault(); f(el, ev); }
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('[data-form]'); if (!f) return; ev.preventDefault(); const fd = new FormData(f); const k = f.dataset.form;
  for (const n of ['from','to']){ const v = (fd.get(n)||'').trim(); if (v && !parseD(v)) return toast('Ngày không hợp lệ. Nhập theo định dạng DD/MM/YYYY, năm 4 chữ số.', 'err'); }
  if (fd.get('from') && fd.get('to') && dayFrom(fd.get('from')) > dayTo(fd.get('to'))) return toast('Từ ngày phải trước hoặc bằng Đến ngày.', 'err');
  if (k==='login') return doLogin(fd);
  if (k==='loginOtp'){ const r = otpCheck(fd.get('otp')||''); if (r.ok) return finishLogin(loginStep.u);
    loginStep.err = r.msg; if (r.locked){ log('Đăng nhập','Nhập sai OTP quá số lần', loginStep.u.username, 'Cảnh báo', loginStep.u.id); save(); loginStep = {u:null, err:r.msg + ' Đăng nhập lại.'}; } return render(); }
  if (k==='msgFilter'){ msgFilter = Object.fromEntries(fd); return go('#/messages?st=' + (msgFilter.st||'')); }
  if (k==='repFilter'){ repFilter = Object.fromEntries(fd); return render(); }
  if (k==='tplFilter'){ tplFilter = Object.fromEntries(fd); if (!isRole('QT')) tplFilter.st = 'active'; return render(); }
  if (k==='logFilter'){ logFilter = Object.fromEntries(fd); return render(); }
  if (k==='settings') return saveSettings(fd);
});
document.addEventListener('compositionend', ev => ev.target.dispatchEvent(new Event('input', {bubbles:true})));
document.addEventListener('input', ev => {
  if (ev.isComposing) return;
  const t = ev.target;
  if (t.id === 'cellQ'){ window.__cellQ = t.value; repCellRefresh(); return; }
  if (!F || route().name !== 'compose') return;
  if (t.dataset.f && ['campaign','docNo','header','body','repetition','duration','tq'].includes(t.dataset.f)){
    F[t.dataset.f] = t.value; clearErr(t.dataset.f, t);
    if (t.dataset.f === 'body' && F.mode==='template'){ const vb = $('#varBox'), k = vars(F.body).join('|'); if (vb && vb.dataset.k !== k){ vb.dataset.k = k; vb.innerHTML = varBox(); } }
    if (t.dataset.f === 'tq'){ const pos = t.selectionStart; $('#secContent').innerHTML = composeContent(); const n = document.querySelector('[data-f=tq]'); n.focus(); n.setSelectionRange(pos,pos); }
    composeRefresh();
  }
  if (t.dataset.var){ F.vars[t.dataset.var] = t.value; clearErr('var_'+t.dataset.var, t); composeRefresh(); }
});
function repCellRefresh(){ const m = S.messages.find(x => x.id===window.__repId); if (!m) return; const r = repCellRows(m); $('#cellTb').innerHTML = r.rows; $('#cellCnt').textContent = `${nf(r.n)}/${nf(m.cells.length)} cell`; }
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'repSel'){ window.__cellQ = ''; window.__cellSt = ''; return go('#/reports?id=' + t.value); }
  if (t.id === 'cellSt'){ window.__cellSt = t.value; return repCellRefresh(); }
  if (t.id === 'areaFile' && t.files[0]){
    const box = $('#areaImportRes'); readRows(t.files[0], (rows, e0) => { t.value = '';
      if (e0) return box.innerHTML = `<div class="alert err" style="margin-top:10px">${esc(e0)}</div>`;
      const r = importAreas(rows);
      if (r.err.length) return box.innerHTML = `<div class="alert err" style="margin-top:10px"><b>File có ${r.err.length} lỗi, chưa nhập dữ liệu nào.</b><ul>${r.err.slice(0,20).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
      let np = 0, up = 0, nx = 0, ux = 0;
      Object.entries(r.provs).forEach(([code,name]) => { const p = S.provinces.find(x => x.code===code); if (p){ if (p.name!==name){ p.name = name; up++; } } else { S.provinces.push({id:uid('P'), code, name}); np++; } });
      Object.entries(r.xas).forEach(([code,x]) => { const pid = S.provinces.find(p => p.code===x.pc).id, o = S.xas.find(y => y.code===code); if (o){ if (o.name!==x.name){ o.name = x.name; ux++; } } else { S.xas.push({id:uid('X'), code, name:x.name, provinceId:pid}); nx++; } });
      const msg = `Thêm ${np} tỉnh, ${nx} xã; cập nhật ${up} tỉnh, ${ux} xã.`; log('Danh mục','Nhập danh mục Tỉnh/Xã từ file', msg); save(); render(); toast(msg, 'ok'); });
    return;
  }
  if (t.id === 'cellFile' && t.files[0]){
    const rd = new FileReader(); rd.onload = () => { const r = importCells(String(rd.result)); const box = $('#importRes');
      if (r.err && !r.rows){ box.innerHTML = `<div class="alert err" style="margin-top:10px">${r.err.map(esc).join('<br>')}</div>`; return; }
      if (r.err.length){ box.innerHTML = `<div class="alert err" style="margin-top:10px"><b>File có ${r.err.length} lỗi, chưa nạp dữ liệu nào.</b><ul>${r.err.slice(0,20).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`; return; }
      const xaIds = new Set(r.rows.map(x => x.xaId)); S.cells = S.cells.filter(c => !xaIds.has(c.xaId)).concat(r.rows); S.cellsUpdatedAt = now();
      log('Danh mục','Cập nhật ánh xạ Xã – Cell ID', `${r.rows.length} cell · ${xaIds.size} xã`, 'Quan trọng'); save(); render(); toast(`Đã nạp ${r.rows.length} cell cho ${xaIds.size} xã.`, 'ok'); };
    rd.readAsText(t.files[0]); return;
  }
  if (!F || route().name !== 'compose') return;
  if (t.dataset.f === 'mode'){ F.mode = t.value; F.errors = {}; $('#errBox').innerHTML = ''; $('#secContent').innerHTML = composeContent(); composeRefresh(); }
  if (t.dataset.f === 'group'){ F.group = t.value; $('#secContent').innerHTML = composeContent(); }
  if (t.dataset.f === 'templateId'){ F.templateId = t.value; const tm = S.templates.find(x => x.id===t.value); if (tm){ F.header = tm.header; F.body = tm.body; F.priority = tm.mi; const ps = document.querySelector('[data-f=priority]'); if (ps) ps.value = tm.mi; } clearErr('templateId'); $('#secContent').innerHTML = composeContent(); composeRefresh(); }
  if (t.dataset.f === 'priority'){ F.priority = Number(t.value); clearErr('priority', t); composeRefresh(); }
  if (t.dataset.f === 'prov'){ F.prov = t.value; $('#secArea').innerHTML = composeArea(); composeRefresh(); }
  if (t.dataset.xa){ F.areas = t.checked ? [...new Set([...F.areas, t.dataset.xa])] : F.areas.filter(a => a !== t.dataset.xa); clearErr('areas'); areaSoftRefresh(); }
});
document.addEventListener('toggle', ev => { if (ev.target.id === 'cellDet') window.__detOpen = ev.target.open; }, true);
window.addEventListener('hashchange', () => { if (route().name !== 'compose') F = null; render(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal').innerHTML) A.closeModal(); if (ev.key === 'Enter' && ev.target.id === 'otpIn'){ ev.preventDefault(); A.otpConfirm(); } });

/* hết phiên khi không thao tác (NF11) */
let lastAct = now();
['click','keydown'].forEach(e => document.addEventListener(e, () => lastAct = now(), true));
setInterval(() => { if (me && now() - lastAct > S.settings.sessionTimeout*60e3){ log('Đăng nhập','Hết phiên do không thao tác', me.username); save(); setSession(null); render(); toast('Phiên làm việc đã hết. Đăng nhập lại.', 'warn'); } }, 15000);

/* ---------- khởi động ---------- */
(function init(){
  try{ S = JSON.parse(lsGet(LS_KEY) || 'null'); }catch(e){ S = null; }
  if (!S || S.v !== 1){ seed(); }
  migrate(); save();
  loadSession(); render();
  setInterval(tick, 500);
})();
</script>
</body>
</html>
